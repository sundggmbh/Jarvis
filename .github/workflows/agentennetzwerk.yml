name: Agentennetzwerk

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      auftrag:
        description: "Auftrag für das Agentennetzwerk (leer = Standardauftrag)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: agentennetzwerk
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --frozen --no-dev

      - name: Agentennetzwerk ausführen
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: uv run --no-dev python scripts/agentennetzwerk.py ${{ github.event.inputs.auftrag }}

      - name: Bericht committen
        run: |
          git config user.name "jarvis-agentennetzwerk"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Kein neuer Bericht."
          else
            git commit -m "Netzwerk-Bericht $(date -u +%Y-%m-%d)"
            git push
          fi
