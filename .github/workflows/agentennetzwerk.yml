name: Agentennetzwerk

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      auftrag:
        description: "Auftrag für das Agentennetzwerk (leer = Standardauftrag)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: agentennetzwerk
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install google-genai pydantic httpx

      - name: Agentennetzwerk ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NETZWERK_MIT_SUCHE: ${{ vars.NETZWERK_MIT_SUCHE || '0' }}
          GEMINI_MODELL: ${{ vars.GEMINI_MODELL || 'gemini-3.8-flash' }}
          NETZWERK_AUFTRAG: ${{ github.event.inputs.auftrag }}
        run: python scripts/agentennetzwerk.py

      - name: Berichte und Arbeitsproben committen
        run: |
          git config user.name "jarvis-agentennetzwerk"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ ausgaben/
          if git diff --cached --quiet; then
            echo "Kein neuer Bericht."
          else
            git commit -m "Netzwerk-Bericht $(date -u +%Y-%m-%d)"
            git push
          fi
