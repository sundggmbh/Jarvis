[project]
name = "jarvis-agentennetzwerk"
version = "0.1.0"
description = "Jarvis Agentennetzwerk – parallele KI-Recherche-Agenten als Mistral Workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.18,<4",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
